<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Existing Purvankara Partner</title>

    <!-- Tanker CSS -->
    <link rel="stylesheet"
          href="{{ url_for('static', filename='tanker.css') }}">

</head>

<body>

<div class="tanker-page">

    <!-- =========================================
         PAGE HEADER
    ========================================== -->

    <div class="tanker-header">

        <h1>
            Existing Purvankara Partner
        </h1>

        <p>
            Register your existing Purvankara tanker contract
        </p>

    </div>


    <!-- =========================================
         FORM CARD
    ========================================== -->

    <div class="form-card">

        <h2>
            Partner Registration
        </h2>

        <p class="form-description">
            Enter your details and existing contract information.
            Your registration will be verified by the Purvankara team.
        </p>


        <form method="POST"
              action="/tanker/register/contracted">


            <!-- =================================
                 OPERATOR DETAILS
            ================================== -->

            <div class="form-section">

                <h3>
                    Operator Details
                </h3>


                <div class="form-group">

                    <label for="operator_name">
                        Full Name
                    </label>

                    <input
                        type="text"
                        id="operator_name"
                        name="operator_name"
                        placeholder="Enter your full name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="Enter mobile number"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter email address"
                        required
                    >

                </div>

            </div>


            <!-- =================================
                 CONTRACT DETAILS
            ================================== -->

            <div class="form-section">

                <h3>
                    Contract Details
                </h3>


                <div class="form-group">

                    <label for="contract_id">
                        Purvankara Contract ID
                    </label>

                    <input
                        type="text"
                        id="contract_id"
                        name="contract_id"
                        placeholder="Enter your contract ID"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="contract_start">
                        Contract Start Date
                    </label>

                    <input
                        type="date"
                        id="contract_start"
                        name="contract_start"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="contract_end">
                        Contract End Date
                    </label>

                    <input
                        type="date"
                        id="contract_end"
                        name="contract_end"
                        required
                    >

                </div>

            </div>


            <!-- =================================
                 TANKER DETAILS
            ================================== -->

            <div class="form-section">

                <h3>
                    Tanker Details
                </h3>


                <div class="form-group">

                    <label for="registration_no">
                        Tanker Registration Number
                    </label>

                    <input
                        type="text"
                        id="registration_no"
                        name="registration_no"
                        placeholder="Example: KA-01-XX-1234"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="capacity">
                        Tanker Capacity
                    </label>

                    <select
                        id="capacity"
                        name="capacity"
                        required
                    >

                        <option value="">
                            Select capacity
                        </option>

                        <option value="5">5 KL</option>
                        <option value="6">6 KL</option>
                        <option value="8">8 KL</option>
                        <option value="10">10 KL</option>
                        <option value="12">12 KL</option>
                        <option value="14">14 KL</option>
                        <option value="16">16 KL</option>
                        <option value="20">20 KL</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="vehicle_model">
                        Vehicle Model
                    </label>

                    <input
                        type="text"
                        id="vehicle_model"
                        name="vehicle_model"
                        placeholder="Enter tanker vehicle model"
                        required
                    >

                </div>

            </div>


            <!-- =================================
                 FORM ACTIONS
            ================================== -->

            <div class="form-actions">

                <a
                    href="/tanker/register"
                    class="btn-secondary"
                >
                    ← Back
                </a>

                <button
                    type="submit"
                    class="btn-primary"
                >
                    Submit for Verification
                </button>

            </div>

        </form>

    </div>

</div>

</body>
</html>
